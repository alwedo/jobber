services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_DB: jobber
      POSTGRES_USER: jobber
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - jobber-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobber -d jobber"]
      interval: 5s
      timeout: 3s
      retries: 10

  jobber:
    build: .
    container_name: jobber
    environment:
      DB_CONN: "postgres://jobber:${POSTGRES_PASSWORD}@postgres:5432/jobber?sslmode=disable"
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - jobber-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  jobber-network:
    driver: bridge
